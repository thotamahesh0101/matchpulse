<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Today's Matches — MatchPulse</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    .matches-page {
      min-height: 100vh;
      padding: 30px 20px 80px;
    }

    .matches-container {
      max-width: 1100px;
      margin: auto;
    }

    .matches-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 40px;
    }

    .back-btn {
      color: var(--text);
      text-decoration: none;
      border: 1px solid rgba(255,255,255,.12);
      padding: 10px 16px;
      border-radius: 12px;
    }

    .matches-title {
      margin-top: 40px;
      margin-bottom: 10px;
      font-size: clamp(34px, 6vw, 64px);
    }

    .matches-subtitle {
      color: #aaa;
      margin-bottom: 30px;
    }

    .filters {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 30px;
    }

    .filter-btn {
      border: 1px solid rgba(255,255,255,.12);
      background: transparent;
      color: var(--text);
      padding: 10px 18px;
      border-radius: 999px;
      cursor: pointer;
    }

    .filter-btn.active {
      background: #7c3aed;
      border-color: #7c3aed;
    }

    .matches-list {
      display: grid;
      gap: 18px;
    }

    .match-item {
      background: var(--surface);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 20px;
      padding: 24px;
    }

    .match-league {
      color: #a78bfa;
      font-size: 13px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1px;
      margin-bottom: 18px;
    }

    .match-main {
      display: grid;
      grid-template-columns: 1fr auto 1fr;
      align-items: center;
      gap: 20px;
    }

    .team {
      font-size: 22px;
      font-weight: 700;
    }

    .team.right {
      text-align: right;
    }

    .vs {
      color: #888;
      font-weight: 700;
    }

    .match-time {
      margin-top: 18px;
      color: #ddd;
    }

    .match-venue {
      margin-top: 6px;
      color: #888;
      font-size: 14px;
    }

    .match-status {
      display: inline-block;
      margin-top: 14px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(34,197,94,.12);
      color: #4ade80;
      font-size: 12px;
      font-weight: 700;
    }

    .empty-message {
      padding: 40px;
      text-align: center;
      color: #888;
    }

    @media (max-width: 600px) {
      .matches-top {
        align-items: flex-start;
      }

      .match-main {
        grid-template-columns: 1fr;
        text-align: center;
      }

      .team.right {
        text-align: center;
      }

      .vs {
        display: none;
      }
    }
  </style>
</head>

<body>

  <main class="matches-page">

    <div class="matches-container">

      <div class="matches-top">
        <div>
          <div class="eyebrow">MATCHPULSE</div>

          <h1 class="matches-title">
            Today's Matches
          </h1>

          <p class="matches-subtitle">
            Live cricket schedule, upcoming matches and results.
          </p>
        </div>

        <a href="index.html" class="back-btn">
          ← Home
        </a>
      </div>

      <div class="filters">
        <button class="filter-btn active" data-filter="ALL">
          All
        </button>

        <button class="filter-btn" data-filter="LIVE">
          🔴 Live
        </button>

        <button class="filter-btn" data-filter="UPCOMING">
          Upcoming
        </button>

        <button class="filter-btn" data-filter="COMPLETED">
          Completed
        </button>
      </div>

      <div id="matches-list" class="matches-list"></div>

    </div>

  </main>

  <script src="matches-data.js"></script>

  <script>
    const matchesList =
      document.getElementById("matches-list");

    const filterButtons =
      document.querySelectorAll(".filter-btn");

    function renderMatches(filter = "ALL") {

      const filteredMatches =
        filter === "ALL"
          ? matches
          : matches.filter(match =>
              match.status === filter
            );

      if (filteredMatches.length === 0) {

        matchesList.innerHTML = `
          <div class="empty-message">
            No matches available.
          </div>
        `;

        return;
      }

      matchesList.innerHTML =
        filteredMatches.map(match => `

          <article class="match-item">

            <div class="match-league">
              ${match.tournament}
            </div>

            <div class="match-main">

              <div class="team">
                ${match.team1}
              </div>

              <div class="vs">
                VS
              </div>

              <div class="team right">
                ${match.team2}
              </div>

            </div>

            <div class="match-time">
              🕒 ${match.time}
            </div>

            <div class="match-venue">
              📍 ${match.venue}
            </div>

            <div class="match-status">
              ${match.status}
            </div>

          </article>

        `).join("");
    }

    filterButtons.forEach(button => {

      button.addEventListener("click", () => {

        filterButtons.forEach(btn =>
          btn.classList.remove("active")
        );

        button.classList.add("active");

        renderMatches(button.dataset.filter);

      });

    });

    renderMatches();
  </script>

</body>
</html>
