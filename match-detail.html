<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Match Details - MatchPulse</title>

  <link rel="stylesheet" href="styles.css">

  <style>
    body {
      background: #0b0f14;
      color: #ffffff;
    }

    .detail-page {
      max-width: 1100px;
      margin: 0 auto;
      padding: 60px 20px;
    }

    .back-btn {
      display: inline-block;
      margin-bottom: 30px;
      color: #ffffff;
      text-decoration: none;
      opacity: 0.8;
    }

    .match-card {
      background: #121820;
      border: 1px solid rgba(255,255,255,0.08);
      border-radius: 20px;
      padding: 35px;
    }

    .tournament {
      font-size: 14px;
      opacity: 0.6;
      margin-bottom: 15px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .match-title {
      font-size: 42px;
      margin-bottom: 25px;
    }

    .match-info {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 15px;
      margin-bottom: 40px;
    }

    .info-box {
      background: #0d131a;
      padding: 20px;
      border-radius: 14px;
    }

    .info-label {
      font-size: 13px;
      opacity: 0.5;
      margin-bottom: 8px;
    }

    .info-value {
      font-size: 17px;
      font-weight: 600;
    }

    .teams {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 20px;
      margin-top: 30px;
    }

    .team-box {
      background: #0d131a;
      padding: 25px;
      border-radius: 16px;
    }

    .team-box h2 {
      margin-bottom: 20px;
    }

    .player {
      padding: 10px 0;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      opacity: 0.85;
    }

    .section {
      margin-top: 40px;
    }

    .section h2 {
      margin-bottom: 20px;
    }

    .vote-box {
      background: #0d131a;
      padding: 25px;
      border-radius: 16px;
    }

    .vote-buttons {
      display: flex;
      gap: 15px;
      margin-top: 20px;
    }

    .vote-buttons button {
      padding: 12px 22px;
      border: none;
      border-radius: 10px;
      cursor: pointer;
      font-weight: 600;
    }

    .vote-result {
      margin-top: 20px;
      font-size: 18px;
    }

    .analysis {
      background: #0d131a;
      padding: 25px;
      border-radius: 16px;
      line-height: 1.8;
      white-space: pre-line;
    }

    @media (max-width: 700px) {
      .match-title {
        font-size: 30px;
      }

      .match-info {
        grid-template-columns: 1fr;
      }

      .teams {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <main class="detail-page">

    <a href="matches.html" class="back-btn">
      ← Back to Matches
    </a>

    <div id="match-container"></div>

  </main>

  <script src="matches-data.js"></script>

  <script>
    const params = new URLSearchParams(window.location.search);

    const matchId = params.get("id");

    const match = matches.find(item => item.id === matchId);

    const container = document.getElementById("match-container");

    if (!match) {

      container.innerHTML = `
        <div class="match-card">
          <h2>Match not found</h2>
          <p>Please go back and select a match.</p>
        </div>
      `;

    } else {

      let votes1 = 63;
      let votes2 = 37;

      function updateVotes() {

        const total = votes1 + votes2;

        const percentage1 =
          Math.round((votes1 / total) * 100);

        const percentage2 =
          Math.round((votes2 / total) * 100);

        document.getElementById("vote-result").innerHTML = `
          <strong>${match.team1}</strong> ${percentage1}%
          &nbsp; | &nbsp;
          <strong>${match.team2}</strong> ${percentage2}%
          <br><br>
          Total votes: ${total}
        `;
      }

      function vote(team) {

        if (team === 1) {
          votes1++;
        }

        if (team === 2) {
          votes2++;
        }

        updateVotes();
      }

      container.innerHTML = `

        <div class="match-card">

          <div class="tournament">
            ${match.tournament}
          </div>

          <h1 class="match-title">
            ${match.team1} vs ${match.team2}
          </h1>

          <div class="match-info">

            <div class="info-box">
              <div class="info-label">TIME</div>
              <div class="info-value">
                ${match.time}
              </div>
            </div>

            <div class="info-box">
              <div class="info-label">VENUE</div>
              <div class="info-value">
                ${match.venue}
              </div>
            </div>

            <div class="info-box">
              <div class="info-label">CITY</div>
              <div class="info-value">
                ${match.city}
              </div>
            </div>

          </div>


          <div class="teams">

            <div class="team-box">

              <h2>
                🇮🇳 ${match.team1}
              </h2>

              ${match.players1.map(player => `
                <div class="player">
                  ${player}
                </div>
              `).join("")}

            </div>


            <div class="team-box">

              <h2>
                🇦🇺 ${match.team2}
              </h2>

              ${match.players2.map(player => `
                <div class="player">
                  ${player}
                </div>
              `).join("")}

            </div>

          </div>


          <div class="section">

            <h2>Who will win?</h2>

            <div class="vote-box">

              <p>
                Vote for the team you think will win.
              </p>

              <div class="vote-buttons">

                <button onclick="vote(1)">
                  ${match.team1}
                </button>

                <button onclick="vote(2)">
                  ${match.team2}
                </button>

              </div>

              <div
                id="vote-result"
                class="vote-result"
              ></div>

            </div>

          </div>


          <div class="section">

            <h2>Match Analysis</h2>

            <div class="analysis">
              ${match.analysis}
            </div>

          </div>

        </div>

      `;

      updateVotes();

    }
  </script>

</body>
</html>
